<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B4A5E"/></marker></defs>
<rect width="1500" height="560" fill="#FFFFFF"/>
<text x="750.0" y="34" text-anchor="middle" style="font-family:Helvetica,Arial,sans-serif;font-size:20px;font-weight:bold" fill="#1F2A37">The 10-step feature loop (one issue = one branch = one pull request)</text>
<rect x="40" y="80" width="255" height="120" rx="10" fill="#EFF4FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="52" y="104" style="font-family:Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold" fill="#1F2A37">1. Pick an issue</text>
<text x="283" y="104" text-anchor="end" style="font-family:Helvetica,Arial,sans-serif;font-size:11px" fill="#2563EB">GitHub</text>
<text x="52" y="136" style="font-family:Consolas,Menlo,monospace;font-size:12.5px" fill="#1F2A37">#12 assigned to you</text>
<rect x="335" y="80" width="255" height="120" rx="10" fill="#F8FAFC" stroke="#3B4A5E" stroke-width="1.5"/>
<text x="347" y="104" style="font-family:Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold" fill="#1F2A37">2. Update main</text>
<text x="578" y="104" text-anchor="end" style="font-family:Helvetica,Arial,sans-serif;font-size:11px" fill="#3B4A5E">Local</text>
<text x="347" y="136" style="font-family:Consolas,Menlo,monospace;font-size:12.5px" fill="#1F2A37">git switch main</text>
<text x="347" y="156" style="font-family:Consolas,Menlo,monospace;font-size:12.5px" fill="#1F2A37">git pull</text>
<rect x="630" y="80" width="255" height="120" rx="10" fill="#F8FAFC" stroke="#3B4A5E" stroke-width="1.5"/>
<text x="642" y="104" style="font-family:Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold" fill="#1F2A37">3. Create branch</text>
<text x="873" y="104" text-anchor="end" style="font-family:Helvetica,Arial,sans-serif;font-size:11px" fill="#3B4A5E">Local</text>
<text x="642" y="136" style="font-family:Consolas,Menlo,monospace;font-size:12.5px" fill="#1F2A37">git switch -c</text>
<text x="642" y="156" style="font-family:Consolas,Menlo,monospace;font-size:12.5px" fill="#1F2A37">feat/12-upload-validation</text>
<rect x="925" y="80" width="255" height="120" rx="10" fill="#F8FAFC" stroke="#3B4A5E" stroke-width="1.5"/>
<text x="937" y="104" style="font-family:Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold" fill="#1F2A37">4. Code + test</text>
<text x="1168" y="104" text-anchor="end" style="font-family:Helvetica,Arial,sans-serif;font-size:11px" fill="#3B4A5E">Local</text>
<text x="937" y="136" style="font-family:Consolas,Menlo,monospace;font-size:12.5px" fill="#1F2A37">edit files</text>
<text x="937" y="156" style="font-family:Consolas,Menlo,monospace;font-size:12.5px" fill="#1F2A37">pytest</text>
<rect x="1220" y="80" width="255" height="120" rx="10" fill="#F8FAFC" stroke="#3B4A5E" stroke-width="1.5"/>
<text x="1232" y="104" style="font-family:Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold" fill="#1F2A37">5. Stage</text>
<text x="1463" y="104" text-anchor="end" style="font-family:Helvetica,Arial,sans-serif;font-size:11px" fill="#3B4A5E">Local</text>
<text x="1232" y="136" style="font-family:Consolas,Menlo,monospace;font-size:12.5px" fill="#1F2A37">git status</text>
<text x="1232" y="156" style="font-family:Consolas,Menlo,monospace;font-size:12.5px" fill="#1F2A37">git add &lt;files&gt;</text>
<rect x="1220" y="340" width="255" height="120" rx="10" fill="#F8FAFC" stroke="#3B4A5E" stroke-width="1.5"/>
<text x="1232" y="364" style="font-family:Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold" fill="#1F2A37">6. Commit</text>
<text x="1463" y="364" text-anchor="end" style="font-family:Helvetica,Arial,sans-serif;font-size:11px" fill="#3B4A5E">Local</text>
<text x="1232" y="396" style="font-family:Consolas,Menlo,monospace;font-size:12.5px" fill="#1F2A37">git commit -m</text>
<text x="1232" y="416" style="font-family:Consolas,Menlo,monospace;font-size:12.5px" fill="#1F2A37">&quot;feat: validate uploads&quot;</text>
<rect x="925" y="340" width="255" height="120" rx="10" fill="#F8FAFC" stroke="#3B4A5E" stroke-width="1.5"/>
<text x="937" y="364" style="font-family:Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold" fill="#1F2A37">7. Push</text>
<text x="1168" y="364" text-anchor="end" style="font-family:Helvetica,Arial,sans-serif;font-size:11px" fill="#3B4A5E">Local</text>
<text x="937" y="396" style="font-family:Consolas,Menlo,monospace;font-size:12.5px" fill="#1F2A37">git push -u origin</text>
<text x="937" y="416" style="font-family:Consolas,Menlo,monospace;font-size:12.5px" fill="#1F2A37">feat/12-upload-validation</text>
<rect x="630" y="340" width="255" height="120" rx="10" fill="#EFF4FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="642" y="364" style="font-family:Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold" fill="#1F2A37">8. Pull request</text>
<text x="873" y="364" text-anchor="end" style="font-family:Helvetica,Arial,sans-serif;font-size:11px" fill="#2563EB">GitHub</text>
<text x="642" y="396" style="font-family:Consolas,Menlo,monospace;font-size:12.5px" fill="#1F2A37">title: &quot;feat: … (closes #12)&quot;</text>
<text x="642" y="416" style="font-family:Consolas,Menlo,monospace;font-size:12.5px" fill="#1F2A37">review + CI must pass</text>
<rect x="335" y="340" width="255" height="120" rx="10" fill="#EFF4FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="347" y="364" style="font-family:Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold" fill="#1F2A37">9. Squash and merge</text>
<text x="578" y="364" text-anchor="end" style="font-family:Helvetica,Arial,sans-serif;font-size:11px" fill="#2563EB">GitHub</text>
<text x="347" y="396" style="font-family:Consolas,Menlo,monospace;font-size:12.5px" fill="#1F2A37">only after approval</text>
<text x="347" y="416" style="font-family:Consolas,Menlo,monospace;font-size:12.5px" fill="#1F2A37">PR shows Merged</text>
<rect x="40" y="340" width="255" height="120" rx="10" fill="#F8FAFC" stroke="#3B4A5E" stroke-width="1.5"/>
<text x="52" y="364" style="font-family:Helvetica,Arial,sans-serif;font-size:15px;font-weight:bold" fill="#1F2A37">10. Clean up</text>
<text x="283" y="364" text-anchor="end" style="font-family:Helvetica,Arial,sans-serif;font-size:11px" fill="#3B4A5E">Local</text>
<text x="52" y="396" style="font-family:Consolas,Menlo,monospace;font-size:12.5px" fill="#1F2A37">git switch main &amp;&amp; git pull</text>
<text x="52" y="416" style="font-family:Consolas,Menlo,monospace;font-size:12.5px" fill="#1F2A37">git branch -d feat/12-…</text>
<line x1="295" y1="140.0" x2="331" y2="140.0" stroke="#3B4A5E" stroke-width="2" marker-end="url(#a)"/>
<line x1="590" y1="140.0" x2="626" y2="140.0" stroke="#3B4A5E" stroke-width="2" marker-end="url(#a)"/>
<line x1="885" y1="140.0" x2="921" y2="140.0" stroke="#3B4A5E" stroke-width="2" marker-end="url(#a)"/>
<line x1="1180" y1="140.0" x2="1216" y2="140.0" stroke="#3B4A5E" stroke-width="2" marker-end="url(#a)"/>
<line x1="1347.5" y1="200" x2="1347.5" y2="336" stroke="#3B4A5E" stroke-width="2" marker-end="url(#a)"/>
<line x1="1220" y1="400.0" x2="1184" y2="400.0" stroke="#3B4A5E" stroke-width="2" marker-end="url(#a)"/>
<line x1="925" y1="400.0" x2="889" y2="400.0" stroke="#3B4A5E" stroke-width="2" marker-end="url(#a)"/>
<line x1="630" y1="400.0" x2="594" y2="400.0" stroke="#3B4A5E" stroke-width="2" marker-end="url(#a)"/>
<line x1="335" y1="400.0" x2="299" y2="400.0" stroke="#3B4A5E" stroke-width="2" marker-end="url(#a)"/>
<path d="M167.5,340 L167.5,204" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#a)"/>
<text x="177.5" y="275.0" style="font-family:Helvetica,Arial,sans-serif;font-size:12px;font-style:italic" fill="#2563EB">next issue</text>
<rect x="40" y="502" width="18" height="14" rx="3" fill="#EFF4FF" stroke="#2563EB"/><text x="66" y="514" style="font-family:Helvetica,Arial,sans-serif;font-size:12px" fill="#1F2A37">happens on github.com</text>
<rect x="240" y="502" width="18" height="14" rx="3" fill="#F8FAFC" stroke="#3B4A5E"/><text x="266" y="514" style="font-family:Helvetica,Arial,sans-serif;font-size:12px" fill="#1F2A37">happens in Git Bash on your computer</text>
<text x="40" y="540" style="font-family:Helvetica,Arial,sans-serif;font-size:12px;font-weight:bold" fill="#B91C1C">Rule: never delete a branch until its pull request shows "Merged".</text>
</svg>