{% extends "base.html" %}
{% block title %}Error {{ status }}{% endblock %}
{% block content %}
  <section class="sw-card sw-error-page">
    <h1 class="sw-card-title">Error {{ status }}</h1>
    <p class="sw-secondary">{{ message }}</p>
    <p class="sw-muted">Code: <code>{{ code }}</code></p>
    <a class="sw-btn" href="{{ url_for('dashboard.index') }}">Back to the dashboard</a>
  </section>
{% endblock %}
