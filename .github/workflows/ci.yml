# Runs on every pull request and every push to main. Branch protection on main requires the "test" job.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read   # least privilege: CI only needs to read the code

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Dummy values: CI never uses real keys or real documents.
      SECUREWASTE_SECRET_KEY: ci-secret-not-real
      SECUREWASTE_HMAC_KEY: ci-hmac-not-real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests with coverage
        run: pytest --cov=securewaste --cov-report=term-missing
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
