# Runs on every pull request and every push to main.
# Branch protection on main requires the "test" job.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read   # least privilege: CI only needs to read the code

jobs:
  test:
    runs-on: ubuntu-latest
    # SCRUM-27/28: the cloud metadata API tests need a real PostgreSQL to
    # prove the insert/read round trip. Same credentials as the documented
    # local setup (cloud_api/README.md), so local and CI behave alike.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: securewaste_cloud_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Dummy values: CI never uses real keys or real documents.
      SECUREWASTE_SECRET_KEY: ci-secret-not-real
      SECUREWASTE_HMAC_KEY: ci-hmac-not-real
      CLOUD_DATABASE_URL: >-
        postgresql://postgres:postgres@localhost:5432/securewaste_cloud_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Apply cloud API schema
        run: >-
          docker exec -i ${{ job.services.postgres.id }}
          psql -U postgres -d securewaste_cloud_ci < cloud_api/schema.sql
      - name: Tests with coverage
        run: pytest --cov=securewaste --cov-report=term-missing
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
