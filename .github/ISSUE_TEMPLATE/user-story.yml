name: User story / feature
description: A new capability, written as a user story
title: "feat: "
labels: ["type: feature"]
body:
  - type: input
    id: story
    attributes:
      label: User story
      description: "As a <persona>, I want <capability> so that <benefit>."
    validations:
      required: true
  - type: input
    id: refs
    attributes:
      label: Requirement IDs
      description: "e.g. US-01, FR-02"
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable checklist. The issue is done when every box is ticked.
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: MoSCoW priority
      options: [Must, Should, Could]
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: Milestone
      options: [M1, M2, M3, M4, M5]
  - type: textarea
    id: notes
    attributes:
      label: Notes / security considerations
