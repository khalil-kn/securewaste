name: Bug report
description: Something does not work as documented
title: "fix: "
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: "**Never paste real documents, personal data or secrets.** Use synthetic fixtures."
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error message / logs
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      description: "OS, Python version, commit hash"
